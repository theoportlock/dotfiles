general {
    colors = true
    interval = 2
}

order += "wireless _first_"
order += "ethernet _first_"
order += "cpu_usage"
order += "cpu_temperature 0"
order += "memory"
order += "disk /home"
order += "battery all"
order += "volume master"
order += "tztime local"

wireless _first_ {
    format_up = "WiFi %quality %essid"
    format_down = ""
}

ethernet _first_ {
    format_up = "LAN %speed"
    format_down = ""
}

cpu_usage {
    format = "CPU %usage"
}

cpu_temperature 0 {
    format = "%degrees°C"
    max_threshold = 75
}

memory {
    format = "RAM %used/%total"
}

disk "/home" {
    format = "Disk %avail"
}

battery all {
    format = "%status %percentage (%remaining)"
    status_chr = "Charging"
    status_bat = "Battery"
    status_full = "Full"
    status_unk = "?"
}

volume master {
    format = "Vol %volume"
    format_muted = "Muted"
    device = "default"
    mixer = "Master"
    mixer_idx = 0
}

tztime local {
    format = "%a %d %b %H:%M"
}
